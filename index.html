<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal API</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      color: #243142;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px;
      background: #ffffff;
      border: 1px solid #dbe3ec;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(36, 49, 66, 0.08);
    }

    h1 {
      margin-top: 0;
      color: #123b5d;
    }

    form {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 24px;
    }

    input,
    button {
      padding: 10px 12px;
      border: 1px solid #b8c6d6;
      border-radius: 5px;
      font-size: 1rem;
    }

    input {
      flex: 1 1 220px;
    }

    button {
      color: #ffffff;
      background: #176b87;
      border-color: #176b87;
      cursor: pointer;
    }

    button:hover {
      background: #0f5269;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
    }

    th,
    td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #dbe3ec;
    }

    th {
      color: #ffffff;
      background: #123b5d;
    }

    #message {
      color: #8a3b12;
    }
  </style>
</head>
<body>
  <main>
    <h1>Campus Meals</h1>

    <form id="search-form">
      <label for="search">Search food, ID, or category:</label>
      <input id="search" name="search" type="text" placeholder="Enter food, ID, or category">
      <button type="submit">Search</button>
      <button id="show-all" type="button">Show all</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Food</th>
          <th>Price</th>
          <th>Category</th>
        </tr>
      </thead>
      <tbody id="meal-list"></tbody>
    </table>

    <p id="message"></p>
  </main>

  <script>
    const searchForm = document.getElementById('search-form');
    const searchInput = document.getElementById('search');
    const showAllButton = document.getElementById('show-all');
    const mealList = document.getElementById('meal-list');
    const message = document.getElementById('message');

    async function loadMeals(search = '') {
      const query = search ? `?search=${encodeURIComponent(search)}` : '';
      const response = await fetch(`/api/meals${query}`);
      const meals = await response.json();

      mealList.innerHTML = meals.map((meal) => `
        <tr>
          <td>${meal.id}</td>
          <td>${meal.food}</td>
          <td>${meal.price}</td>
          <td>${meal.category}</td>
        </tr>
      `).join('');
      message.textContent = meals.length ? '' : 'No food found.';
    }

    searchForm.addEventListener('submit', (event) => {
      event.preventDefault();
      loadMeals(searchInput.value);
    });

    showAllButton.addEventListener('click', () => {
      searchInput.value = '';
      loadMeals();
    });

    loadMeals();
  </script>
</body>
</html>
